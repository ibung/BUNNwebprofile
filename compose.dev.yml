# Hanya untuk pengembangan lokal: menjalankan PostgreSQL. App dijalankan dengan `pnpm dev`.
# Kata sandi di bawah hanya untuk database lokal yang terikat ke 127.0.0.1. Jangan dipakai di server.
name: bunn-portfolio-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bunn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bunn_dev_only}
      POSTGRES_DB: bunn_portfolio
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - db-dev:/var/lib/postgresql/data

volumes:
  db-dev:
